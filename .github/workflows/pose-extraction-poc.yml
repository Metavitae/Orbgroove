name: Pose extraction (Solo mode PoC)

# Runs the MediaPipe detection half of the pose-extraction pipeline
# (tools/pose-extraction/) on a GitHub-hosted runner, because mediapipe's
# wheel requires AVX and the local dev machine's CPU doesn't have it.
#
# The download+frame-grab half runs locally instead (`extract_pose.py grab`)
# because YouTube's bot-detection blocks video downloads from GitHub-hosted
# runner IPs. So the frames this job detects on are committed to whatever
# branch triggers this workflow -- scratch frame images, checked in only
# long enough for this job to read them, then deleted from the branch
# afterward. The source videos themselves are never downloaded here and
# never committed anywhere.

on:
  workflow_dispatch:
    inputs:
      batch_dir:
        description: "Directory (in this branch) of extracted frame JPGs to batch-detect"
        required: true
        default: "tools/pose-extraction/batch_house"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GL libs (mediapipe's shared lib needs these even headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install dependencies
        run: pip install mediapipe

      - name: Batch-detect pose landmarks
        run: |
          python3 tools/pose-extraction/batch_detect.py "${{ inputs.batch_dir }}" out

      - name: Upload landmark JSON only
        uses: actions/upload-artifact@v4
        with:
          name: pose-landmarks-batch
          path: out/
          retention-days: 7
