name: Pose extraction (Solo mode PoC)

# Runs the MediaPipe detection half of the pose-extraction pipeline
# (tools/pose-extraction/) on a GitHub-hosted runner, because mediapipe's
# wheel requires AVX and the local dev machine's CPU doesn't have it.
#
# The download+frame-grab half runs locally instead (`extract_pose.py grab`)
# because YouTube's bot-detection blocks video downloads from GitHub-hosted
# runner IPs. So the frame this job detects on is committed to whatever
# branch triggers this workflow -- a scratch frame image, checked in only
# long enough for this job to read it, then deleted from the branch
# afterward. The source video itself is never downloaded here and never
# committed anywhere.

on:
  workflow_dispatch:
    inputs:
      frame_path:
        description: "Path (in this branch) to the extracted frame JPG"
        required: true
      label:
        description: "Move label, e.g. 'basic groove, weight down'"
        required: false
        default: ""
      source_note:
        description: "Provenance note, e.g. 'house source 1 of 9' -- never the video itself"
        required: false
        default: ""

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system GL libs (mediapipe's shared lib needs these even headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install dependencies
        run: pip install mediapipe

      - name: Detect pose landmarks
        run: |
          python3 tools/pose-extraction/extract_pose.py detect \
            "${{ inputs.frame_path }}" \
            out/pose.json \
            --label "${{ inputs.label }}" \
            --source-note "${{ inputs.source_note }}"

      - name: Upload landmark JSON only
        uses: actions/upload-artifact@v4
        with:
          name: pose-landmarks
          path: out/pose.json
          retention-days: 7
